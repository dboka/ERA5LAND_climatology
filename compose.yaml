services:
  db:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_DB: climate
      POSTGRES_USER: climate
      POSTGRES_PASSWORD: ${CLIMATE_DB_PASSWORD:?Set CLIMATE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - climate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climate -d climate"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  climate_pgdata:
