name: Deploy climate map to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify committed climate snapshot
        run: |
          test -f public/data/meta.json
          node -e "const m=require('./public/data/meta.json'); if(m.mode!=='era5_land'||m.countries_with_data!==188) process.exit(1)"
          test -f public/data/precipitation/meta.json
          node -e "const m=require('./public/data/precipitation/meta.json'); if(m.mode!=='era5_land'||m.countries_with_data!==188||m.latest_date<'2026-11-08') process.exit(1)"
          node -e "const fs=require('fs'); for(const folder of ['public/data','public/data/precipitation']) {const m=require('./'+folder+'/meta.json'); if(m.first_date!=='1991-01-01'||m.baseline!=='1991–2020') process.exit(1); for(let y=1991;y<=2020;y++) for(let n=1;n<=12;n++) if(!fs.existsSync(folder+'/'+y+'-'+String(n).padStart(2,'0')+'.json')) process.exit(1)}"
      - name: Build static site
        run: npm run build
        env:
          VITE_STATIC_DATA: '1'
          GITHUB_PAGES: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
